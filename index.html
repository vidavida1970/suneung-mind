  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0e0f12; color: #f4f1ea; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    header { padding: 18px 16px 4px; text-align: center; }
    header h1 { margin: 0; font-size: 1.05rem; line-height: 1.45; font-weight: 700; }
    .brief {
      margin: 12px 12px 16px;
      padding: 14px 14px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      background: #17181d;
    }
    .brief h2 {
      margin: 0 0 10px;
      font-size: .95rem;
      letter-spacing: .04em;
      font-weight: 700;
    }
    audio { width: 100%; height: 40px; display: block; }
    .hint { display: none; margin: 8px 0 0; font-size: .78rem; opacity: .7; }
    .slide { width: 100%; display: block; height: auto; background: #1a1b1f; }
    .pager { position: sticky; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); text-align: center; font-size: .75rem; background: linear-gradient(transparent, #0e0f12 40%); }
  </style>

<body>
  <header>
    <h1>수능의 압박을 평안과 성장으로 바꾸는<br>마음 근력 훈련</h1>
  </header>
  <section class="brief" aria-label="오디오브리프">
    <h2>오디오브리프</h2>
    <audio id="brief" controls autoplay preload="auto" playsinline controlslist="nodownload">
      <source src="assets/brief.m4a" type="audio/mp4">
    </audio>
    <p class="hint" id="hint">카톡·아이폰은 자동재생을 막아, 화면을 한 번 터치하면 바로 나옵니다.</p>
  </section>
  <main>
    <img class="slide" src="assets/p01.jpg" alt="1쪽" width="1720" height="960">
    <img class="slide" src="assets/p02.jpg" alt="2쪽" width="1720" height="960">
    <img class="slide" src="assets/p03.jpg" alt="3쪽" width="1720" height="960">

    <img class="slide" src="assets/p05.jpg" alt="5쪽" width="1720" height="960">
    <img class="slide" src="assets/p06.jpg" alt="6쪽" width="1720" height="960">
    <img class="slide" src="assets/p07.jpg" alt="7쪽" width="1720" height="960">
    <img class="slide" src="assets/p08.jpg" alt="8쪽" width="1720" height="960">
    <img class="slide" src="assets/p09.jpg" alt="9쪽" width="1720" height="960">
    <img class="slide" src="assets/p10.jpg" alt="10쪽" width="1720" height="960">
    <img class="slide" src="assets/p11.jpg" alt="11쪽" width="1720" height="960">
    <img class="slide" src="assets/p12.jpg" alt="12쪽" width="1720" height="960">
  </main>
  <div class="pager">마음 근력 훈련 가이드 · 12장</div>
  <script>
    (function () {
      var a = document.getElementById("brief");
      var hint = document.getElementById("hint");
      if (!a) return;
      var started = false;
      function tryPlay() {
        if (started) return;
        var p = a.play();
        if (p && p.then) {
          p.then(function () {
            started = true;
            if (hint) hint.style.display = "none";
          }).catch(function () {
            if (hint) hint.style.display = "block";
          });
        }
      }
      a.autoplay = true;
      a.preload = "auto";
      try { a.load(); } catch (e) {}
      ["canplay", "canplaythrough", "loadeddata"].forEach(function (ev) {
        a.addEventListener(ev, tryPlay);
      });
      document.addEventListener("DOMContentLoaded", tryPlay);
      window.addEventListener("load", tryPlay);
      ["pointerdown", "touchstart", "click", "scroll"].forEach(function (ev) {
        document.addEventListener(ev, tryPlay, { capture: true, passive: true });
      });
      setTimeout(tryPlay, 300);
    })();
  </script>
</body>
